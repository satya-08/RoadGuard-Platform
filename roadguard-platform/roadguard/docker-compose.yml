version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: roadguard-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: roadguard_db
      MYSQL_USER: roadguard_user
      MYSQL_PASSWORD: roadguard_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadguard-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://roadguard_user:roadguard_password@db:3306/roadguard_db
      - SECRET_KEY=roadguard-docker-secret-key-2026
      - MODEL_PATH=/app/ml/checkpoints/roadsense_best.pt
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./ml/checkpoints:/app/ml/checkpoints

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roadguard-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
